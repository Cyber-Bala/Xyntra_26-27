databases:
  - name: xyntra-postgres
    databaseName: xyntradb
    user: xyntra_user
    plan: free

services:
  - type: web
    name: xyntra-backend
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn xyntra.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xyntra-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
